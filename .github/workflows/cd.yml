name: CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GSMSV_HOST }}
          username: ${{ secrets.GSMSV_USERNAME }}
          password: ${{ secrets.GSMSV_PASSWORD }}
          port: ${{ secrets.GSMSV_PORT }}
          script: |
            cd ~/Rels-back || exit 1
            
            git pull origin main
            chmod +x gradlew
            ./gradlew build -x test --no-daemon -Dorg.gradle.jvmargs="-Xmx512m"
            
            PID=$(pgrep -f 'Rels-.*\.jar')
            if [ -n "$PID" ]; then
              kill -15 $PID
              sleep 3
            fi
            
            # 입출력 완벽 차단 및 disown 처리로 SSH 세션 종속성 제거
            nohup java -Xmx512m -jar build/libs/*-SNAPSHOT.jar > app.log 2>&1 < /dev/null &
            disown
            sleep 2