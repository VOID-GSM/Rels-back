name: CI

on: 
  push:
    branches: [ develop, feat/dockerfile ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

        # 성공하면 디코 알림
      - name: Notify Discord (success)
        if: success()
        uses: sarisia/actions-status-discord@v1
        with: 
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: 백엔드 CI 통과
          description: "브랜치: '${{ github.ref_name }}' | 테스트 성공"
          color: 0x57F287

        # 실패하면 디코 알림
      - name: Notify Discord (failure)
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: 백엔드 CI 실패
          description: "브랜치: '${{ github.ref_name }}' | 코드를 확인해주세요. "
          color: 0xED4245